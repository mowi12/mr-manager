version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore"
      include: "scope"

    groups:
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
